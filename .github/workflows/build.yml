name: Verify Research Companion builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -B scripts/audit-source.py --history --ref HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Run tests, build and mount the ad-hoc package
        shell: bash
        run: |
          tag_args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag_args=(--tag "$GITHUB_REF_NAME"); fi
          python3 scripts/release.py "${tag_args[@]}"
      - run: cd dist && shasum -a 256 -c *.sha256
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -B scripts/audit-source.py --history --ref HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: '10.0.404'
      - run: python -m pip install Pillow==11.3.0
      - name: Install Windows installer compiler
        shell: pwsh
        run: choco install nsis --version=3.13.0 --yes --no-progress --allow-downgrade
      - name: Build and test the shared bridge
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tagArgs = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tagArgs = @('--tag', $env:GITHUB_REF_NAME) }
          python -B scripts/release.py --bridge-only --output "$env:RUNNER_TEMP/rc-bridge" @tagArgs
      - name: Build and validate the x64 installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:NUGET_PACKAGES = Join-Path $env:RUNNER_TEMP 'rc-nuget'
          $pdfium = Join-Path $env:RUNNER_TEMP 'pdfium-win-x64.tgz'
          Invoke-WebRequest -Uri 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8165/pdfium-win-x64.tgz' -OutFile $pdfium
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/rc-bridge/dsh-research-companion-*.tgz")
          if ($archives.Count -ne 1) { throw 'Expected one shared bridge archive.' }
          dotnet restore windows/ResearchCompanion.Windows/ResearchCompanion.Windows.csproj --locked-mode -r win-x64 -p:SelfContained=true
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          $output = Join-Path $env:RUNNER_TEMP 'rc-windows'
          python -B windows/build.py --nuget-cache "$env:NUGET_PACKAGES" --pdfium-archive "$pdfium" --bridge-archive "$($archives[0].FullName)" --makensis "$makensis" --output "$output" --run-checks
          $installers = @(Get-ChildItem "$output/*-setup.exe")
          if ($installers.Count -ne 1) { throw 'Expected one x64 installer.' }
          $expected = (Get-Content -Raw "$($installers[0].FullName).sha256").Split(' ')[0]
          if ((Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Windows installer SHA-256 mismatch.' }
