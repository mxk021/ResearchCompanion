name: Verify macOS release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -B scripts/audit-source.py --history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Run tests, build and mount the ad-hoc package
        shell: bash
        run: |
          tag_args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag_args=(--tag "$GITHUB_REF_NAME"); fi
          python3 scripts/release.py "${tag_args[@]}"
      - run: cd dist && shasum -a 256 -c *.sha256
